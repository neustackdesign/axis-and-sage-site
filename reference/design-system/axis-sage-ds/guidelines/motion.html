<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"><style>.r{display:grid;grid-template-columns:140px 110px minmax(0,1fr);gap:24px;align-items:center;padding:16px 0;border-top:1px solid var(--haze-300)}.t{height:4px;background:var(--haze-300);position:relative}.t i{position:absolute;left:0;top:0;bottom:0;background:var(--midnight-900)}</style></head><body><div><div class="r"><span class="k" style="color:var(--text-primary)">Quick</span><span class="v">160ms</span><div class="stack" style="gap:8px"><div class="t"><i style="width:10%"></i></div><span class="cap">Hover: underline, tint</span></div></div><div class="r"><span class="k" style="color:var(--text-primary)">Base</span><span class="v">240ms</span><div class="stack" style="gap:8px"><div class="t"><i style="width:15%"></i></div><span class="cap">State changes</span></div></div><div class="r"><span class="k" style="color:var(--text-primary)">Enter</span><span class="v">600ms</span><div class="stack" style="gap:8px"><div class="t"><i style="width:37.5%"></i></div><span class="cap">First view: 12px rise and fade</span></div></div><div class="r"><span class="k" style="color:var(--text-primary)">Draw</span><span class="v">1600ms</span><div class="stack" style="gap:8px"><div class="t"><i style="width:100%"></i></div><span class="cap">Diagrams drawing in</span></div></div><p class="cap" style="margin-top:20px">Ease out cubic-bezier(.2, .7, .1, 1). Reduced motion sets every duration to zero.</p></div></body></html>

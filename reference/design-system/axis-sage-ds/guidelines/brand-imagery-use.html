<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"><style>.g{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr) minmax(0,4fr);gap:20px;height:440px}.cover{position:relative;overflow:hidden}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.88) contrast(.95) brightness(.92)}.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,6,38,.9) 0%,rgba(11,6,38,.55) 48%,rgba(11,6,38,0) 80%)}.cover .tx{position:absolute;left:32px;bottom:32px;right:40%;z-index:1;color:var(--cloud-100);display:flex;flex-direction:column;gap:14px}.cover h3{font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:36px;letter-spacing:-.01em}.story{display:grid;grid-template-rows:1fr auto}.story .q{background:var(--creme-100);color:var(--brown-800);padding:28px;display:flex;flex-direction:column;gap:16px}.story .q p.serif{font-size:22px;line-height:28px}.c{margin-top:12px}</style></head><body><div class="g"><div class="stack"><div class="photo" style="flex:1"><img src="../assets/images/brand-hardware.jpg" alt=""><span class="tag">Product &amp; Technology</span></div><p class="cap c">Caption: mono label, inside the frame, bottom right.</p></div><div class="stack"><div class="cover" style="flex:1"><img src="../assets/images/brand-club.jpg" alt="" style="object-position:70% 40%"><div class="tx"><span class="k" style="color:var(--bloom-500)">Strategy &amp; Investment</span><h3>Investors commit when the terms are clear.</h3></div></div><p class="cap c">Cover: Midnight shade only where type sits.</p></div><div class="stack"><div class="story" style="flex:1"><div class="photo"><img src="../assets/images/brand-cafe.jpg" alt=""></div><div class="q"><span class="k" style="color:var(--brown-800)">Partners sign</span><p class="serif">Two sides of the table, one set of terms.</p></div></div><p class="cap c">Story: photo over a Creme panel.</p></div></div></body></html>

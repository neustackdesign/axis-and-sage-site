<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"><style>.g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}.c{display:flex;flex-direction:column;gap:14px}.ln{height:56px;display:flex;align-items:center}.sh{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin-top:56px}.sq{height:88px;background:var(--cloud-50);box-shadow:inset 0 0 0 1px var(--haze-300)}</style></head><body><div class="g"><div class="c"><div class="ln"><div style="width:100%;border-top:var(--border-rule)"></div></div><span class="k" style="color:var(--text-primary)">Rule</span><span class="cap">haze-300 · cells, lists</span></div><div class="c"><div class="ln"><div style="width:100%;border-top:var(--border-strong)"></div></div><span class="k" style="color:var(--text-primary)">Strong</span><span class="cap">midnight · opens a list</span></div><div class="c"><div class="ln"><div style="width:100%;border-top:var(--border-dotted)"></div></div><span class="k" style="color:var(--text-primary)">Dotted</span><span class="cap">baselines, fill-in slots</span></div><div class="c"><div class="ln dark" style="padding:0 12px"><div style="width:100%;border-top:var(--border-rule-dark)"></div></div><span class="k" style="color:var(--text-primary)">Rule on dark</span><span class="cap">midnight-600</span></div></div><div class="sh"><div class="c"><div class="sq"></div><span class="k" style="color:var(--text-primary)">Square</span><span class="cap">Cards, buttons, fields, images</span></div><div class="c"><div class="sq" style="border-radius:999px;height:56px;width:140px;align-self:flex-start;margin-top:16px;margin-bottom:16px"></div><span class="k" style="color:var(--text-primary)">Pill</span><span class="cap">Chips and glyph containers</span></div><div class="c"><div class="sq" style="border-radius:50%;width:88px"></div><span class="k" style="color:var(--text-primary)">Circle</span><span class="cap">Avatars, badges, step marks</span></div></div></body></html>
